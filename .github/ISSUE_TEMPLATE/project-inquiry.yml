name: "🚀 Start a Project — Quick Fixed-Price Quote"
description: "Need a Next.js web app, Python automation/bot, or bug-fix & deployment on an indie-friendly budget?"
title: "[Project Inquiry] "
labels: ["inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! Share a quick 30-second brief below and I'll reply with a clear scope, fixed-price milestone quote, and realistic timeline within 24 hours.
        Prefer email instead of GitHub? Send your brief directly to **concumm2@gmail.com**.

  - type: dropdown
    id: project_type
    attributes:
      label: "Project Type"
      options:
        - "Full-Stack Web App / Micro-SaaS MVP"
        - "Python Automation / Bot / Scraper"
        - "Bug Fixing, Optimization & Deployment (Existing App)"
        - "Other Custom Tool"
    validations:
      required: true

  - type: dropdown
    id: budget
    attributes:
      label: "Estimated Budget"
      options:
        - "$35 – $100 (Quick Script / Bug Fix)"
        - "$100 – $250 (Feature / Bot / Tool)"
        - "$250 – $500+ (Full SaaS MVP)"
        - "Flexible — Suggest an optimal scope"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "What do you want to build or fix?"
      description: "Share your core goal, deadline, and any reference link or repo."
      placeholder: "e.g., Build a Next.js web app with Stripe checkout, create a Python Telegram/scraper bot, or fix bugs & deploy an existing app."
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: "Where can I reach you? (Email / Telegram / Discord / WhatsApp)"
      placeholder: "e.g., name@company.com, @telegram_handle, or Discord username"
    validations:
      required: true
