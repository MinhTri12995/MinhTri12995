    <text x="18" y="26" fill="#6E7570" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEMS TELEMETRY</text>
    <line x1="18" y1="36" x2="266" y2="36" stroke="#252C28" stroke-width="1"/>
    <text x="18" y="58" fill="#A3A8A3" font-family="'SFMono-Regular', Consolas, monospace" font-size="12">COMPUTE</text>
    <text x="266" y="58" text-anchor="end" fill="#10B981" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700">20x AI AGENTS</text>
    <text x="18" y="80" fill="#A3A8A3" font-family="'SFMono-Regular', Consolas, monospace" font-size="12">SHIPPED</text>
    <text x="266" y="80" text-anchor="end" fill="#F2F0EA" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700">3+ PROD SYSTEMS</text>
    <text x="18" y="102" fill="#A3A8A3" font-family="'SFMono-Regular', Consolas, monospace" font-size="12">RATES</text>
    <text x="266" y="102" text-anchor="end" fill="#D97757" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700">$35–$350 / GIG</text>
  </g>

  <!-- Main Identity -->
  <text x="56" y="138" fill="#F2F0EA" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Nguyen Minh Tri
  </text>
  <text x="56" y="176" fill="#A3A8A3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
