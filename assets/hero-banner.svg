<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nguyen Minh Tri - Systems-First Vibe Coder">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B201D" stroke-width="1"/>
    </pattern>
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D0F0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="12" fill="#0D0F0E"/>
  <rect width="1200" height="300" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="12" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#252C28" stroke-width="1"/>
  <rect x="0" y="0" width="1200" height="3" rx="2" fill="url(#topAccent)"/>

  <!-- Availability Pill -->
  <g transform="translate(56, 44)">
    <rect width="468" height="30" rx="15" fill="#131715" stroke="#252C28" stroke-width="1"/>
    <circle cx="20" cy="15" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="19.5" fill="#A3A8A3" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">
      AVAILABLE FOR PART-TIME &amp; PER-PROJECT GIGS · FAST TURNAROUND
    </text>
  </g>

  <!-- Right Side Architecture Telemetry -->
  <g transform="translate(860, 44)">
