  <g transform="translate(56, 228)">
    <rect width="206" height="36" rx="6" fill="#131715" stroke="#252C28" stroke-width="1"/>
    <text x="103" y="23" text-anchor="middle" fill="#F2F0EA" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600">AI SaaS &amp; Web MVPs</text>
  </g>
  <g transform="translate(278, 228)">
