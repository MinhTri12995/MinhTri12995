    <rect x="22" y="180" width="96" height="26" rx="6" fill="#2A1D19" stroke="#5A372B"/>
    <text x="70" y="197" text-anchor="middle" fill="#F0B199" font-family="ui-monospace, monospace" font-size="11" font-weight="600">AI PIPELINES</text>
    <rect x="128" y="180" width="98" height="26" rx="6" fill="#181D1B" stroke="#2A332E"/>
    <text x="177" y="197" text-anchor="middle" fill="#D5DDD9" font-family="ui-monospace, monospace" font-size="11" font-weight="600">PYTHON BOTS</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(726, 16)">
    <rect width="336" height="228" rx="12" fill="#131715"/>
    <rect width="336" height="228" rx="12" fill="url(#cardGlow1)"/>
    <rect x="0.75" y="0.75" width="334.5" height="226.5" rx="11.25" stroke="#24302A" stroke-width="1.5"/>
    <text x="22" y="34" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">03 // FAST &amp; FAIR PER-PROJECT</text>
