    <line x1="22" y1="164" x2="314" y2="164" stroke="#222A26" stroke-width="1"/>
    <rect x="22" y="180" width="96" height="26" rx="6" fill="#0F261F" stroke="#1F513F"/>
    <text x="70" y="197" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">1–7D DELIVERY</text>
    <rect x="128" y="180" width="98" height="26" rx="6" fill="#181D1B" stroke="#2A332E"/>
    <text x="177" y="197" text-anchor="middle" fill="#D5DDD9" font-family="ui-monospace, monospace" font-size="11" font-weight="600">$35–$350 SCOPE</text>
